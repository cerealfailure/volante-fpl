<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel variant of the volante mark:
       pitch scoreboard square with V chevron + ball at center. -->

  <!-- Pitch background: mower-striped green -->
  <rect width="16" height="16" fill="#2a8c2a"/>
  <rect x="0" y="0"  width="16" height="2" fill="#1e6b1e"/>
  <rect x="0" y="4"  width="16" height="2" fill="#1e6b1e"/>
  <rect x="0" y="8"  width="16" height="2" fill="#1e6b1e"/>
  <rect x="0" y="12" width="16" height="2" fill="#1e6b1e"/>

  <!-- Subbuteo navy outline -->
  <rect x="0" y="0" width="16" height="1" fill="#1a1a2e"/>
  <rect x="0" y="15" width="16" height="1" fill="#1a1a2e"/>
  <rect x="0" y="0" width="1" height="16" fill="#1a1a2e"/>
  <rect x="15" y="0" width="1" height="16" fill="#1a1a2e"/>

  <!-- V chevron (red-card accent) -->
  <rect x="2" y="6" width="1" height="1" fill="#e63946"/>
  <rect x="3" y="5" width="1" height="1" fill="#e63946"/>
  <rect x="4" y="4" width="1" height="1" fill="#e63946"/>
  <rect x="5" y="3" width="1" height="1" fill="#e63946"/>
  <rect x="6" y="2" width="1" height="1" fill="#e63946"/>
  <rect x="7" y="2" width="2" height="1" fill="#e63946"/>
  <rect x="9" y="2" width="1" height="1" fill="#e63946"/>
  <rect x="10" y="3" width="1" height="1" fill="#e63946"/>
  <rect x="11" y="4" width="1" height="1" fill="#e63946"/>
  <rect x="12" y="5" width="1" height="1" fill="#e63946"/>
  <rect x="13" y="6" width="1" height="1" fill="#e63946"/>

  <!-- Ball at center spot -->
  <rect x="7" y="9"  width="2" height="1" fill="#f4eede"/>
  <rect x="6" y="10" width="4" height="2" fill="#f4eede"/>
  <rect x="7" y="12" width="2" height="1" fill="#f4eede"/>
  <!-- Ball seam -->
  <rect x="7" y="10" width="2" height="1" fill="#1a1a2e"/>
  <rect x="8" y="11" width="1" height="1" fill="#1a1a2e"/>
</svg>
